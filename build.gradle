plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.14'
}

def minecraftTarget = project.minecraft_version
if (!(minecraftTarget in ['26.2', '26.3'])) {
    throw new GradleException("Unsupported Minecraft target: ${minecraftTarget}")
}
def fabricVersion = minecraftTarget == '26.3' ? project.fabric_version_26_3 : project.fabric_version
def fabricMinimum = fabricVersion.split('\\+')[0]
if (minecraftTarget == '26.3') {
    layout.buildDirectory = file('build/26.3')
}

def selectedVersion = providers.environmentVariable('MANHUNT_VERSION').getOrElse(project.mod_version)
if (!(selectedVersion ==~ /(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)/)) {
    throw new GradleException('Mod version must be a number such as 1.0.1')
}
version = "${selectedVersion}+mc${project.minecraft_version}"
group = 'com.evanchubbuck.manhunt'
base { archivesName = 'manhunt' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraftTarget', minecraftTarget
    inputs.property 'fabricMinimum', fabricMinimum
    inputs.property 'loaderVersion', project.loader_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft: minecraftTarget,
                fabric_minimum: fabricMinimum, loader: project.loader_version
    }
}

java {
    withSourcesJar()
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

jar { from('LICENSE') }

sourceSets {
    main {
        java.srcDir 'shared/src/main/java'
        java.srcDir "src/${minecraftTarget}/java"
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

// Test against an operator-supplied companion JAR without bundling it in Manhunt.
def linkedHardcoreJar = providers.gradleProperty('linkedHardcoreJar')
def linkedHardcoreTests = linkedHardcoreJar.isPresent()
if (linkedHardcoreTests) {
    dependencies {
        gametestRuntimeOnly files(linkedHardcoreJar.get())
        gametestRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${minecraftTarget == '26.2' ? '0.156.0+26.2' : fabricVersion}"
    }
}

tasks.named('processGametestResources') {
    inputs.property 'linkedHardcoreTests', linkedHardcoreTests
    filesMatching('fabric.mod.json') {
        expand test_entrypoint: linkedHardcoreTests ? 'ManhuntLinkedHardcoreGameTests' : 'ManhuntGameTests'
    }
}

tasks.named('build') { dependsOn ':velocity-plugin:build' }

loom {
    mods {
        manhunt { sourceSet sourceSets.main }
        manhunt_tests { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Manhunt Game Tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/gametest${linkedHardcoreTests ? '-linked-hardcore' : ''}-results.xml"
            runDir "${layout.buildDirectory.get()}/gametest${linkedHardcoreTests ? '-linked-hardcore' : ''}"
        }
    }
}
